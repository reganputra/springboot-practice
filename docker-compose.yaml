services:
  mysql:
    image: mysql:latest
    container_name: taskmanagement-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskmanagement_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
